[project]
name = "firewall-log-analysis-api"
version = "1.0.0"
description = "FastAPI application with LangGraph workflow for firewall log analysis"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "langchain>=0.1.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "duckduckgo-search>=4.0.0",
    "ddgs>=9.8.0",
    "vonage>=3.0.0",
    "python-dotenv>=1.0.0",
]


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["constants", "graph", "testing", "dataset_labeling"]

[tool.ruff]
line-length = 79
target-version = "py39"

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

